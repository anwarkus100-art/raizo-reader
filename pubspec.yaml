name: raizo_reader
description: Raizo Reader - Multi-language PDF, EPUB Viewer and Background Audio Reader.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  syncfusion_flutter_pdf: ^26.1.35
  syncfusion_flutter_pdfviewer: ^26.1.35
  epubx: ^4.0.0
  flutter_tts: ^4.0.2
  audio_service: ^0.18.15
  wakelock_plus: ^1.2.5
  xml: ^6.5.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true
